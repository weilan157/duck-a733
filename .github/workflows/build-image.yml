# 一条流水线：编应用（aarch64）→ 编 BSP → 把应用合进 rootfs → 出 SD 卡镜像
#
# 设计要点
#   * 两个上游仓库都不复制进本仓库，按 ref 拉取；改 ref / dispatch 入参就是换版本。
#   * BSP 的 rootfs = "debootstrap 根 + vendor/rootfs/micro/overlay 覆盖"，
#     所以应用只需要往 overlay 里丢文件（scripts/stage-app.sh），不改 BSP 脚本。
#   * 产物直接可写卡：a733-image-<bsp>-<app>.img + .sha256；打 tag 时再发 Release。
#   * 首次跑要拉 BSP 的 sources/（6~8GB）+ 全量内核编译；之后靠三层缓存：
#       sources/  →  内核/uboot 的 out/  →  cargo registry/target
name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    types: [opened, synchronize]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'microduck 分支/标签/commit（Feetech 硬件用 feat/feetech 或 a733 tag）'
        required: false
        default: 'feat/feetech'
      bsp_ref:
        description: 'bsp 分支/标签/commit'
        required: false
        default: 'cubie-a7z-a733'
      skip_image:
        description: '只编应用，不出镜像'
        type: boolean
        default: false

# 同一分支上的旧构建直接取消：内核编译很贵，不要排队浪费 runner
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write      # tag 时发 Release 需要

env:
  BSP_REPO: weilan157/bsp
  APP_REPO: weilan157/microduck
  BSP_REF: ${{ inputs.bsp_ref || 'cubie-a7z-a733' }}
  APP_REF: ${{ inputs.app_ref || 'feat/feetech' }}
  # A733 + 复刻 HAT 是 Feetech HD-1910；robotd 必须编 feetech feature，
  # 否则即使 checkout 了 feat/feetech，默认仍是 Dynamixel XL330。
  APP_FEATURES: feetech
  # 不设 CARGO_TARGET_*_LINKER：链接器由 `cargo board`（cargo-zigbuild）自己接管。
  # 设成 aarch64-linux-gnu-gcc 会盖掉 zig 的 linker，glibc floor 就没了，而板子是
  # 2.41 的 userland——编出来能跑在本机 runner 上，到板子上才炸。
  CARGO_INCREMENTAL: '0'

jobs:
  # ─────────────────────────── 1. 应用 ───────────────────────────
  app:
    name: app (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: checkout 本仓库（scripts/）
        uses: actions/checkout@v4

      - name: checkout microduck
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          fetch-depth: 1

      - name: 记录 app commit
        id: vars
        run: echo "sha=$(git -C app rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: rust 工具链 + aarch64 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          rustc -V; cargo -V

      # 仓库 `.cargo/config.toml` 里的 `cargo board` = `cargo zigbuild --release
      # --target aarch64-unknown-linux-gnu.2.31`：zig 供交叉 C 工具链，并把 glibc
      # floor 钉在 2.31（低于板子的 2.41，留余量）。zig 版本跟着 upstream 的
      # release 钉，别用 latest——floor 是刻意固定的输入。
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: cargo-zigbuild（给 `cargo board` 用）
        run: cargo install cargo-zigbuild --locked

      - name: 交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libssl-dev binutils

      # mediad 在 Linux 上非可选地依赖 gstreamer/glib——pkg-config crate，交叉编译要
      # 目标机的头文件、.pc 和 .so。用 upstream 自己的 scripts/cross-sysroot.sh 从
      # Debian trixie（板子同源）解包，而不是 Ubuntu multiarch：板子跑的是 Debian 的
      # GStreamer，用 Ubuntu 的编出来只是"能链上"。
      #
      # 按脚本自己哈希缓存，包列表改了自然失效。
      - name: 缓存 aarch64 sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/duck-sysroot
          key: duck-sysroot-${{ hashFiles('app/scripts/cross-sysroot.sh') }}

      - name: 取 aarch64 sysroot（GStreamer / libudev，给 mediad 用）
        run: |
          set -eu
          export DUCK_SYSROOT="$HOME/.cache/duck-sysroot"
          sh app/scripts/cross-sysroot.sh | tee /tmp/sysroot.log

          # GITHUB_ENV 不做 shell 展开，而脚本打印的 RUSTFLAGS 里是
          # "${RUSTFLAGS:+$RUSTFLAGS }-L ..."——直接写会把花括号写进变量。
          # 所以先在这个 shell 里 eval 一遍，再写展开后的值。
          eval "$(grep '^export' /tmp/sysroot.log)"
          {
            echo "PKG_CONFIG_SYSROOT_DIR=$PKG_CONFIG_SYSROOT_DIR"
            echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"
            echo "PKG_CONFIG_ALLOW_CROSS=$PKG_CONFIG_ALLOW_CROSS"
            echo "RUSTFLAGS=$RUSTFLAGS"
          } >> "$GITHUB_ENV"

      # registry 与 target 分开缓存：Cargo.lock 变了也只是重编，不重下
      - name: 缓存 cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-reg-

      - name: 缓存 cargo target
        uses: actions/cache@v4
        with:
          path: app/target
          key: cargo-target-${{ env.APP_REF }}-${{ env.APP_FEATURES }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-target-${{ env.APP_REF }}-${{ env.APP_FEATURES }}-

      # 用 bash 显式调用：脚本是在 Windows 上写的，可执行位容易在提交时丢掉，
      # 别再依赖 checkout 后的 mode 位（126 Permission denied 就是这么来的）
      - name: 编译并整理 dist/app
        run: bash ./scripts/build-app.sh app dist/app

      - name: 冒烟（qemu 直接跑一遍 aarch64 二进制）
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          qemu-aarch64-static -L /usr/aarch64-linux-gnu dist/app/usr/local/bin/robotd --version
          qemu-aarch64-static -L /usr/aarch64-linux-gnu dist/app/usr/local/bin/robotctl --version

      - name: 上传应用产物
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/app
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────── 2. 镜像 ───────────────────────────
  image:
    name: image (a733)
    needs: app
    if: ${{ !inputs.skip_image && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: 腾磁盘（runner 只有 ~14GB 空闲，BSP sources + 内核编译要 20GB+）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/android-sdk \
                      /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: checkout 本仓库（scripts/ + config/）
        uses: actions/checkout@v4

      - name: 取应用产物
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist/app

      - name: checkout bsp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BSP_REPO }}
          ref: ${{ env.BSP_REF }}
          path: bsp
          fetch-depth: 1

      - name: 主机依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu bison flex bc libssl-dev libncurses-dev \
            rsync curl wget git ca-certificates file \
            python3 python3-setuptools swig \
            device-tree-compiler kmod cpio \
            debootstrap qemu-user-static binfmt-support \
            dosfstools mtools e2fsprogs gdisk fakeroot uuid-runtime parted zstd xz-utils
          df -h /

      # 源码缓存：键里带上 BSP ref 与 mod-a733.sh 的哈希（拉取逻辑变了就失效）
      - name: 缓存 BSP 源码（sources/ 约 6~8GB）
        uses: actions/cache@v4
        with:
          path: bsp/sources
          key: a733-sources-${{ env.BSP_REF }}-${{ hashFiles('bsp/scripts/mod-a733.sh') }}
          restore-keys: |
            a733-sources-${{ env.BSP_REF }}-
            a733-sources-

      # 编译产物缓存：内核/U-Boot 的 out/ 里是 .o，命中后增量编译只需几分钟
      - name: 缓存 BSP 编译产物（out/，跳过 rootfs 与镜像）
        uses: actions/cache@v4
        with:
          path: |
            bsp/out/kernel
            bsp/out/uboot
          key: a733-out-${{ env.BSP_REF }}-${{ hashFiles('bsp/scripts/mod-a733.sh', 'bsp/config.env.example') }}
          restore-keys: a733-out-${{ env.BSP_REF }}-

      - name: 应用 CI 配置（直连 GitHub，不用 ghfast 代理）
        working-directory: bsp
        run: |
          cp -n config.env.example config.env 2>/dev/null || true
          grep -v '^\s*#' ../config/a733-ci.env | grep -v '^\s*$' | while IFS='=' read -r k v; do
            v="${v%\"}"; v="${v#\"}"
            ./bsp config "$k=$v"
          done
          grep -E '^(PLATFORM|A733_.*REPO|MAKE_JOBS|ROOTFS_TYPE)=' config.env

      # 上面那份是"镜像侧"的工具（debootstrap/qemu/mtools…）；"BSP 构建侧"的权威
      # 清单在 bsp 自己的 scripts/mod-a733.sh（cmd_a733_env）里，直接调它，不在这份
      # YAML 里抄第二份——第一次跑就是因为少抄了 gcc-arm-linux-gnueabi 而挂掉：
      # A733 的 u-boot 是 AArch32，必须用 soft-float 的 gnueabi 工具链。
      # 顺带把 mkimage(u-boot-tools)、xxd、lz4、libelf-dev、uuid-dev 一起装上。
      #
      # 必须在"应用 CI 配置"之后：`./bsp env` 按 config.env 里的 PLATFORM 分发，
      # 早于它就是 rk3566 的清单，装的全是不相干的东西。
      - name: BSP 构建依赖（用 BSP 自己的清单）
        working-directory: bsp
        run: ./bsp env

      - name: bsp setup（克隆 u-boot / kernel / bsp / device）
        working-directory: bsp
        run: ./bsp setup

      - name: bsp uboot
        working-directory: bsp
        run: ./bsp uboot

      - name: bsp kernel
        working-directory: bsp
        run: ./bsp kernel

      - name: bsp rootfs
        working-directory: bsp
        run: ./bsp rootfs

      - name: 把应用合进 rootfs overlay
        run: bash ./scripts/stage-app.sh bsp dist/app

      - name: bsp pack（出 SD 卡镜像）
        working-directory: bsp
        run: ./bsp pack

      - name: 收集产物 + 校验和
        id: collect
        run: |
          set -euo pipefail
          bsp_sha="$(git -C bsp rev-parse --short HEAD)"
          app_sha="${{ needs.app.outputs.sha }}"
          name="a733-image-${bsp_sha}${app_sha:+-$app_sha}"
          mkdir -p out
          img="$(ls bsp/out/a733/*.img | head -1)"
          cp "$img" "out/${name}.img"
          ( cd out && sha256sum "${name}.img" | tee "${name}.img.sha256" )
          ls -lh out
          {
            echo "### 镜像"
            echo ""
            echo '```'
            cat "out/${name}.img.sha256"
            echo '```'
            echo ""
            echo "- BSP: \`${BSP_REPO}@${BSP_REF}\` (${bsp_sha})"
            echo "- APP: \`${APP_REPO}@${APP_REF}\` (${app_sha:-n/a})"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          name: a733-image
          path: |
            out/*.img
            out/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # 打 tag（v*）时把镜像挂成 Release 资产，方便直接下载
      - name: 发布 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.img
            out/*.sha256
          body: |
            A733 / Cubie A7Z image
            - BSP：`${{ env.BSP_REPO }}@${{ env.BSP_REF }}`
            - APP：`${{ env.APP_REPO }}@${{ env.APP_REF }}`
            - 开机后机器人**不动**（robotd 只跑控制环、不使能扭矩）；
              站立需要显式 `robotctl robot init`。
